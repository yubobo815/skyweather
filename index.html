<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#052434" />
    <meta name="description" content="Breezo: practical weather, tailored for today." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Breezo</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Breezo home"><img src="assets/breezo-mark.svg" alt="" /><span>Breezo</span></a>
        <div class="header-actions">
          <button class="unit-toggle" id="unit-toggle" type="button" data-i18n-aria="switchUnit" aria-label="Switch temperature unit">C</button>
          <div class="language-toggle" data-i18n-aria="language" aria-label="Language"><button data-language="en" class="is-active" aria-pressed="true" type="button">EN</button><button data-language="zh" aria-pressed="false" type="button">中</button></div>
        </div>
      </header>

      <section class="search-row" data-i18n-aria="searchWeather" aria-label="Search weather">
        <label class="search-field"><span class="sr-only" data-i18n="searchLabel">Search a city</span><input id="city-search" autocomplete="off" placeholder="Search a city" /><button id="search-button" type="button" data-i18n-aria="search" aria-label="Search">⌕</button></label>
        <button id="location-button" class="icon-button" type="button" data-i18n-aria="useLocation" aria-label="Use current location">⌖</button>
      </section>

      <p class="status" id="status" role="status"></p>
      <section class="saved-cities saved-cities-bar" id="saved-cities" hidden aria-label="Saved cities"></section>
      <section id="weather" class="weather" aria-live="polite">
        <div class="empty-state"><img src="assets/breezo-mark.svg" alt="" /><h1 data-i18n="welcome">Weather that fits your day</h1><p data-i18n="welcomeCopy">Search a city or use your location to get started.</p></div>
      </section>
    </main>
    <template id="weather-template">
      <nav class="forecast-tabs" aria-label="Forecast sections">
        <a class="is-active" href="#today" data-i18n="today">Today</a>
        <a href="#hourly-section" data-i18n="hourlyTab">Hourly</a>
        <a href="#forecast-section" data-i18n="tenDay">10 days</a>
      </nav>
      <section class="hero" id="today">
        <div class="hero-copy"><p class="eyebrow" id="place"></p><div class="condition-heading"><span class="condition-icon" id="condition-icon" aria-hidden="true"></span><h1 id="condition"></h1></div><p id="summary"></p></div>
        <div class="temperature"><strong id="temperature"></strong><span id="temperature-unit"></span><small id="feels-like"></small></div>
      </section>
      <section class="metrics" aria-label="Weather details">
        <article><span data-i18n="humidity">Humidity</span><strong id="humidity"></strong></article>
        <article><span data-i18n="wind">Wind</span><strong id="wind"></strong></article>
        <article><span data-i18n="rain">Rain</span><strong id="rain"></strong></article>
        <article><span data-i18n="uv">UV index</span><strong id="uv"></strong></article>
      </section>
      <section class="alerts" id="alerts" hidden aria-live="polite"></section>
      <section class="rain-callout" aria-live="polite"><span class="rain-callout-icon" aria-hidden="true">☂</span><div><p data-i18n="rainOutlook">Rain outlook</p><strong id="rain-outlook"></strong></div></section>
      <section class="insights">
        <article class="insight"><div><p class="eyebrow" data-i18n="todaysKit">Today's kit</p><h2 id="kit-title"></h2><p id="kit-copy"></p></div></article>
        <article class="insight"><div><p class="eyebrow" data-i18n="comfort">Comfort</p><h2 id="comfort-title"></h2><p id="comfort-copy"></p></div></article>
        <article class="insight"><div><p class="eyebrow" data-i18n="sport">Sport</p><h2 id="sport-title"></h2><p id="sport-copy"></p></div></article>
      </section>
      <section class="hourly-section" id="hourly-section"><div class="section-heading"><h2 data-i18n="hourly">Next 12 hours</h2><span id="rain-timing" class="rain-timing"></span></div><div id="hourly" class="hourly" aria-label="Hourly forecast"></div></section>
      <section class="forecast-section" id="forecast-section"><div class="section-heading"><h2 data-i18n="outlook">Next 10 days</h2></div><div id="forecast" class="forecast"></div></section>
      <footer class="freshness"><span id="updated-at"></span><button id="refresh-button" class="refresh-button" type="button" data-i18n-aria="refresh" data-i18n-title="refresh" aria-label="Refresh forecast" title="Refresh forecast">↻</button></footer>
    </template>
    <script type="module" src="app.js"></script>
  </body>
</html>
